# Dependabot configuration (VERSION 1.0.0)
# Weekly pip dependency updates to keep FastAPI/uvicorn/qrcode current.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
