# Dependabot configuration (VERSION 1.2.0)
# VERSION 1.2.0 -- restored the "github-actions" ecosystem entry: CodeQL
#   and CI workflows now exist under .github/workflows/ (c2b0b27 removed
#   it when the repo had no workflows; refs: v1.1.0 dependabot fix).
# VERSION 1.1.0 -- dropped "github-actions": no workflow files existed,
#   so Dependabot raised "couldn't find a <anything>.yml". (refs: v1.0.0)
# Weekly pip dependency updates to keep FastAPI/uvicorn/qrcode current.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
